name: Windows scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-scripts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-Item final_script.ps1) + @(Get-ChildItem scripts/windows -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' })
          if ($files.Count -eq 0) { throw 'No Windows scripts found.' }
          $invalid = $false
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Output "$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $invalid = $true
            }
          }
          if ($invalid) { throw 'Windows PowerShell 5.1 parsing failed.' }
      - name: Parse scripts with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-Item final_script.ps1) + @(Get-ChildItem scripts/windows -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' })
          if ($files.Count -eq 0) { throw 'No Windows scripts found.' }
          $invalid = $false
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $tokens, [ref] $parseErrors) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Output "$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              $invalid = $true
            }
          }
          if ($invalid) { throw 'PowerShell 7 parsing failed.' }
      - name: Install Pester 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck
      - name: Test Windows scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $result = Invoke-Pester -Path scripts/windows/tests -Output Detailed -PassThru
          if ($result.TotalCount -eq 0 -or $result.FailedCount -gt 0) { throw 'Windows script tests failed or no tests ran.' }
