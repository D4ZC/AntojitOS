services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: antojit_os
      POSTGRES_USER: antojit
      POSTGRES_PASSWORD: antojit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - antojit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antojit -d antojit_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  antojit_postgres:

