services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.pilot
    volumes:
      - pilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Containerfile
      target: api
    restart: unless-stopped
    env_file:
      - .env.pilot
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: web
    restart: unless-stopped
    ports:
      - "${PILOT_BIND_ADDRESS:-0.0.0.0}:${PILOT_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  print-agent:
    build:
      context: .
      dockerfile: Containerfile
      target: print-agent
    restart: unless-stopped
    env_file:
      - .env.pilot
    volumes:
      - pilot_print_agent:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  pilot_postgres:
  pilot_print_agent:
